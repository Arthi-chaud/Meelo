# This compose allows to build the whole project in a "production"-like environment
services:
  traefik:
    image: traefik:v3.7
    restart: "on-failure"
    command:
      - "--api.insecure=true"
      - "--accesslog=true"
      - "--log.level=WARN"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker=true"
      - "--providers.docker.constraints=Label(`traefik.scope`, `meelo-local-${PORT}`)"     
    ports:
      - ${PORT:-5000}:80
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
  server:
    init: true
    build:
      context: ./server
      args:
        - VERSION=local
    expose:
      - 4000
    restart: on-failure
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api/`)"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.api.middlewares=strip-api@docker"
      - "traefik.scope=meelo-local-${PORT}"
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      mq:
        condition: service_healthy
    volumes:
      - ${DATA_DIR}:${INTERNAL_DATA_DIR}
      - ${CONFIG_DIR}:${INTERNAL_CONFIG_DIR}
    env_file:
      - .env
    environment:
      - TRANSCODER_URL=http://transcoder:7666
      - MEILI_HOST=http://meilisearch:7700
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@mq:5672
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:4000"]
      interval: 3s
      timeout: 5s
      retries: 20
  front:
    build:
      context: ./front
      args:
        - VERSION=local
    expose:
      - 3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front.rule=PathPrefix(`/`)"
      - "traefik.scope=meelo-local-${PORT}"
    depends_on:
      server:
        condition: service_healthy
      scanner:
        condition: service_healthy
    environment:
      - PUBLIC_SERVER_URL=${PUBLIC_URL}/api
      - SSR_SERVER_URL=http://server:4000
      - PUBLIC_SCANNER_URL=${PUBLIC_URL}/scanner
      - SSR_SCANNER_URL=http://scanner:8133
      - PUBLIC_MATCHER_URL=${PUBLIC_URL}/matcher
      - SSR_MATCHER_URL=http://matcher:6789
  scanner:
    build:
      context: ./scanner
      args:
        - VERSION=local
    expose:
      - 8133
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scanner.rule=PathPrefix(`/scanner/`)"
      - "traefik.http.middlewares.strip-scanner.stripprefix.prefixes=/scanner"
      - "traefik.http.routers.scanner.middlewares=strip-scanner@docker"
      - "traefik.scope=meelo-local-${PORT}"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:8133"]
      interval: 3s
      timeout: 5s
      retries: 20
    environment:
      - API_URL=http://server:4000
      - INTERNAL_CONFIG_DIR=${INTERNAL_CONFIG_DIR}
      - INTERNAL_DATA_DIR=${INTERNAL_DATA_DIR}
      - API_KEYS=${API_KEYS}
    volumes:
      - ${DATA_DIR}:${INTERNAL_DATA_DIR}:ro
      - ${CONFIG_DIR}:${INTERNAL_CONFIG_DIR}:ro
  matcher:
    build:
      context: ./matcher
      args:
        - VERSION=local
    restart: on-failure
    expose:
      - 6789
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.matcher.rule=PathPrefix(`/matcher/`)"
      - "traefik.http.middlewares.strip-matcher.stripprefix.prefixes=/matcher"
      - "traefik.http.routers.matcher.middlewares=strip-matcher@docker"
      - "traefik.scope=meelo-local-${PORT}"
    depends_on:
      server:
        condition: service_healthy
      mq:
        condition: service_healthy
    environment:
      - API_URL=http://server:4000
      - INTERNAL_CONFIG_DIR=${INTERNAL_CONFIG_DIR}
      - API_KEYS=${API_KEYS}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@mq:5672
    volumes:
      - ${CONFIG_DIR}:${INTERNAL_CONFIG_DIR}:ro
  transcoder:
    image: ghcr.io/zoriya/kyoo_transcoder:5.2.1
    restart: on-failure
    cpus: 1
    expose:
      - 7666
    depends_on:
      db:
        condition: service_healthy
    environment:
      - GOCODER_SAFE_PATH=${INTERNAL_DATA_DIR}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
      - PGHOST=db
      - PGPORT=5432
    volumes:
      - ${DATA_DIR}:${INTERNAL_DATA_DIR}:ro
      - transcoder_cache:/cache
  db:
    image: postgres:alpine3.14
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    env_file:
      - .env
    volumes:
      - db:/var/lib/postgresql/data
  meilisearch:
    image: getmeili/meilisearch:v1.5
    restart: on-failure
    expose:
      - 7700
    volumes:
      - search:/meili_data
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_LOG_LEVEL=WARN
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://0.0.0.0:7700/health",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
  mq:
    image: rabbitmq:4.3-alpine
    hostname: meelo-mq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
volumes:
  db:
  config:
  data:
  search:
  transcoder_cache:
  rabbitmq_data:
